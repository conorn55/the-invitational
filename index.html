<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Tournament Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="bg-glow"></div>

<header class="page-header">
  <div class="header-inner">
    <div class="title-block">
      <span class="chip-suit">&spades;</span>
      <div>
        <h1>Poker Tournament</h1>
        <p class="subtitle">Season Leaderboard</p>
      </div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
</header>

<main class="board-wrap">
  <div class="board-card">
    <table class="leaderboard" id="leaderboard">
      <thead>
        <tr>
          <th class="col-rank">#</th>
          <th class="col-name">Player</th>
          <th class="col-num">Played</th>
          <th class="col-num">Won</th>
          <th class="col-num">Top 3</th>
          <th class="col-num">Top 5</th>
          <th class="col-num col-points">Points</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
      </tbody>
    </table>
  </div>
  <p class="hint">Tap a player for detailed stats</p>
</main>

<footer class="page-footer">
  <p id="lastUpdated"></p>
</footer>

<!-- Player detail overlay -->
<div class="overlay" id="overlay">
  <div class="detail-panel" id="detailPanel" role="dialog" aria-modal="true">
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
