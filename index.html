<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Tournament Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="bg-glow"></div>

<header class="page-header">
  <div class="header-inner">
    <div class="title-block">
      <span class="chip-suit" id="eventLogo">&spades;</span>
      <div>
        <h1 id="eventName">Poker Tournament</h1>
        <p class="subtitle" id="eventSubtitle">Season Leaderboard</p>
      </div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
</header>

<main class="board-wrap">
  <div class="board-card">
    <table class="leaderboard" id="leaderboard">
      <thead>
        <tr>
          <th class="col-rank">#</th>
          <th class="col-name">Player</th>
          <th class="col-num">Played</th>
          <th class="col-num col-icon" title="Wins">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M7 5H4v1a3 3 0 0 0 3 3M17 5h3v1a3 3 0 0 1-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M12 12v3M9 19h6M10 19v-2.5a2 2 0 0 1 4 0V19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Wins</span>
          </th>
          <th class="col-num col-icon" title="Top 3 finishes">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="3" y="11" width="5" height="9" rx="1" fill="currentColor" opacity="0.6"/>
              <rect x="9.5" y="6" width="5" height="14" rx="1" fill="currentColor"/>
              <rect x="16" y="13" width="5" height="7" rx="1" fill="currentColor" opacity="0.4"/>
            </svg>
            <span class="sr-only">Top 3 finishes</span>
          </th>
          <th class="col-num col-icon" title="Top 5 finishes">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="1" y="16" width="3" height="5" rx="0.8" fill="currentColor" opacity="0.35"/>
              <rect x="5.75" y="13" width="3" height="8" rx="0.8" fill="currentColor" opacity="0.5"/>
              <rect x="10.5" y="10" width="3" height="11" rx="0.8" fill="currentColor" opacity="0.65"/>
              <rect x="15.25" y="7" width="3" height="14" rx="0.8" fill="currentColor" opacity="0.8"/>
              <rect x="20" y="4" width="3" height="17" rx="0.8" fill="currentColor"/>
            </svg>
            <span class="sr-only">Top 5 finishes</span>
          </th>
          <th class="col-num col-points">Points</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
      </tbody>
    </table>
  </div>
  <p class="hint">Tap a player for detailed stats</p>
</main>

<footer class="page-footer">
  <p id="lastUpdated"></p>
</footer>

<!-- Player detail overlay -->
<div class="overlay" id="overlay">
  <div class="detail-panel" id="detailPanel" role="dialog" aria-modal="true">
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
